apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorokeep.fullname" . }}-secret
  labels:
    {{- include "sorokeep.labels" . | nindent 4 }}
type: Opaque
# Each sensitive config.yaml field lives under its own key here (rather
# than as one pre-rendered config.yaml blob) so it can be overridden
# independently at install time and so each value's emptiness can be
# verified independently. The merge-config init container in
# deployment.yaml reads these individually and folds any non-empty ones
# into the final config.yaml alongside the ConfigMap's non-sensitive
# fragment. Left empty by default — see README "Secret handling".
stringData:
  slackToken: {{ .Values.secrets.slackToken | quote }}
  telegramBotToken: {{ .Values.secrets.telegramBotToken | quote }}
  feeSponsorSecret: {{ .Values.secrets.feeSponsorSecret | quote }}
